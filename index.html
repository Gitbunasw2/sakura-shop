<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aki Shop — Kho & đơn hàng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <strong>Aki Shop</strong>
          <small>Kho · Đơn hàng</small>
        </div>
      </div>
      <nav>
        <button class="nav-btn active" data-view="dashboard">Tổng quan</button>
        <button class="nav-btn" data-view="inventory">Kho hàng</button>
        <button class="nav-btn" data-view="orders">Đơn hàng</button>
        <button class="nav-btn" data-view="invoices">Hóa đơn nhập/xuất</button>
        <button class="nav-btn" data-view="contributions">Góp vốn</button>
      </nav>
      <div class="sidebar-foot">
        <button id="btn-export" class="ghost" type="button">Xuất backup</button>
        <button id="btn-import" class="ghost" type="button">Nhập backup</button>
        <button id="btn-signout" class="ghost hidden" type="button">Đăng xuất</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <h1 id="page-title">Tổng quan</h1>
        <div class="top-actions" id="top-actions"></div>
      </header>

      <section id="view-dashboard" class="view"></section>
      <section id="view-inventory" class="view hidden"></section>
      <section id="view-orders" class="view hidden"></section>
      <section id="view-invoices" class="view hidden"></section>
      <section id="view-contributions" class="view hidden"></section>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="modal-title"></h2>
          <button id="modal-close" class="icon-btn" aria-label="Đóng">×</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <div id="supabase-auth-gate" class="auth-gate hidden">
      <section class="auth-card">
        <h1>Aki Shop</h1>
        <p>Đăng nhập để đồng bộ dữ liệu cửa hàng.</p>
        <form id="supabase-login-form" class="stack">
          <label>Email<input name="email" type="email" autocomplete="username" required /></label>
          <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required /></label>
          <button class="btn sakura" type="submit">Đăng nhập</button>
          <p id="supabase-auth-error" class="auth-error" role="alert"></p>
        </form>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
